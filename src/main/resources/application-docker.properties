# PostgreSQL Docker Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/forex_platform
spring.datasource.username=forex_admin
spring.datasource.password=forex_password
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA DDL Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console is disabled in production docker environments
spring.h2.console.enabled=false
